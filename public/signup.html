<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'">
    <title>CHATTING - Criar Conta</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Great+Vibes&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #070d1f 0%, #0c1e3a 20%, #0f3460 45%, #0ea5a0 70%, #16c79a 85%, #1dd1a1 100%);
            overflow: hidden;
            position: relative;
        }

        .bg-particles { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
        .bg-particles span { position: absolute; width: 3px; height: 3px; background: rgba(255,255,255,0.2); border-radius: 50%; animation: particleUp linear infinite; }
        @keyframes particleUp { 0% { transform: translateY(100vh) scale(0); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } 100% { transform: translateY(-20vh) scale(1); opacity: 0; } }

        .left { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; z-index: 1; min-height: 100vh; }
        .scene { position: relative; width: 520px; height: 480px; animation: sceneFloat 5s ease-in-out infinite; }
        @keyframes sceneFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }

        .platform { position: absolute; width: 340px; height: 180px; left: 50%; top: 50%; transform: translate(-50%, -50%) rotateX(55deg) rotateZ(-45deg); background: linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.04)); border-radius: 16px; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 40px 80px rgba(0,0,0,0.25); }

        .phone { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); width: 100px; height: 180px; background: #1e293b; border-radius: 18px; border: 3px solid #334155; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.4); z-index: 5; animation: phoneFloat 3.5s ease-in-out infinite; }
        @keyframes phoneFloat { 0%,100% { transform: translate(-50%, -50%) translateY(0); } 50% { transform: translate(-50%, -50%) translateY(-8px); } }
        .phone-notch { width: 40px; height: 5px; background: #0f172a; border-radius: 0 0 6px 6px; margin: 0 auto; }
        .phone-screen { margin: 4px 6px; height: calc(100% - 12px); background: linear-gradient(180deg, #38bdf8, #22d3ee); border-radius: 12px; padding: 12px 8px; display: flex; flex-direction: column; gap: 6px; }
        .phone-bubble { padding: 6px 10px; border-radius: 10px; font-size: 7px; max-width: 75%; opacity: 0; animation: bubbleIn 0.4s ease forwards; line-height: 1.3; }
        .phone-bubble:nth-child(1) { background: rgba(255,255,255,0.9); color: #334155; align-self: flex-start; animation-delay: 0.6s; }
        .phone-bubble:nth-child(2) { background: rgba(0,210,211,0.9); color: white; align-self: flex-end; animation-delay: 1.2s; }
        .phone-bubble:nth-child(3) { background: rgba(255,255,255,0.9); color: #334155; align-self: flex-start; animation-delay: 1.8s; }
        .phone-bubble:nth-child(4) { background: rgba(0,210,211,0.9); color: white; align-self: flex-end; animation-delay: 2.4s; }
        @keyframes bubbleIn { 0% { opacity: 0; transform: translateY(8px) scale(0.85); } 100% { opacity: 1; transform: translateY(0) scale(1); } }

        .person { position: absolute; z-index: 4; }
        .person-head { width: 28px; height: 28px; background: #fcd9b6; border-radius: 50%; margin: 0 auto; position: relative; }
        .person-head::before { content: ''; position: absolute; top: -4px; left: 2px; right: 2px; height: 18px; background: #1e293b; border-radius: 14px 14px 0 0; }
        .person-eyes { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; }
        .person-eyes span { width: 3px; height: 3px; background: #1e293b; border-radius: 50%; }
        .person-body { width: 34px; height: 30px; background: linear-gradient(135deg, #0ea5a0, #22d3ee); border-radius: 8px 8px 4px 4px; margin: 2px auto 0; }
        .person-legs { display: flex; gap: 4px; justify-content: center; margin-top: 2px; }
        .person-leg { width: 10px; height: 20px; background: #1e293b; border-radius: 4px; }

        .p1 { bottom: 60px; left: 40px; animation: personBob 3s ease-in-out infinite; }
        .p2 { top: 60px; right: 50px; animation: personBob 3s ease-in-out 0.5s infinite; }
        .p3 { bottom: 70px; right: 30px; animation: personBob 3s ease-in-out 1s infinite; }
        .p4 { top: 80px; left: 30px; animation: personBob 3s ease-in-out 1.5s infinite; }
        @keyframes personBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

        .emoji { position: absolute; font-size: 26px; z-index: 6; animation: emojiFloat 4s ease-in-out infinite; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.15)); }
        .e1 { top: 18%; left: 22%; animation-delay: 0s; } .e2 { top: 28%; left: 12%; animation-delay: 0.6s; } .e3 { top: 40%; left: 6%; animation-delay: 1.2s; }
        .e4 { top: 15%; right: 28%; animation-delay: 1.8s; } .e5 { top: 25%; right: 18%; animation-delay: 2.4s; } .e6 { bottom: 25%; left: 15%; animation-delay: 3s; }
        @keyframes emojiFloat { 0%,100% { transform: translateY(0) rotate(-5deg); } 50% { transform: translateY(-14px) rotate(5deg); } }

        .float-bubble { position: absolute; background: rgba(255,255,255,0.92); border-radius: 18px; padding: 10px 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.1); z-index: 6; animation: floatBubble 5s ease-in-out infinite; }
        .float-bubble::after { content: ''; position: absolute; bottom: -7px; left: 16px; width: 14px; height: 14px; background: rgba(255,255,255,0.92); transform: rotate(45deg); border-radius: 0 0 3px 0; }
        .fb1 { top: 25%; left: 15%; animation-delay: 0s; } .fb2 { top: 42%; left: 8%; animation-delay: 1.2s; }
        .float-dots { display: flex; gap: 4px; align-items: center; }
        .float-dots span { width: 5px; height: 5px; background: #94a3b8; border-radius: 50%; animation: dotBounce 1.2s ease-in-out infinite; }
        .float-dots span:nth-child(2) { animation-delay: 0.15s; } .float-dots span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes dotBounce { 0%,60%,100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-4px); opacity: 1; } }
        @keyframes floatBubble { 0%,100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-12px) rotate(1deg); } }

        .right {
            width: 420px;
            padding: 50px 55px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            z-index: 10;
            background: rgba(255,255,255,0.08);
            border-radius: 24px;
            border: 1px solid rgba(255,255,255,0.12);
            backdrop-filter: blur(10px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .title { font-size: 42px; font-weight: 900; color: white; letter-spacing: 3px; text-shadow: 0 4px 20px rgba(0,0,0,0.3); animation: fadeSlide 0.7s ease-out; font-family: 'Poppins', sans-serif; text-transform: uppercase; }
        .subtitle { color: rgba(255,255,255,0.85); font-size: 15px; margin-top: 10px; margin-bottom: 32px; font-weight: 300; animation: fadeSlide 0.7s ease-out 0.1s both; letter-spacing: 0.5px; }
        @keyframes fadeSlide { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

        .input-wrap { position: relative; margin-bottom: 16px; animation: fadeSlide 0.7s ease-out both; }
        .input-wrap:nth-child(2) { animation-delay: 0.15s; } .input-wrap:nth-child(3) { animation-delay: 0.25s; } .input-wrap:nth-child(4) { animation-delay: 0.35s; }

        .input-wrap input { width: 100%; padding: 16px 50px 16px 22px; border: 1px solid rgba(255,255,255,0.25); border-radius: 50px; background: rgba(255,255,255,0.07); backdrop-filter: blur(6px); font-size: 15px; color: white; font-family: 'Poppins', sans-serif; outline: none; transition: all 0.3s ease; }
        .input-wrap input::placeholder { color: rgba(255,255,255,0.5); }
        .input-wrap input:focus { border-color: #1dd1a1; background: rgba(255,255,255,0.12); box-shadow: 0 0 25px rgba(29,209,161,0.2); transform: scale(1.01); }
        .input-wrap .icon { position: absolute; right: 18px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.35); transition: color 0.3s; pointer-events: none; display: flex; align-items: center; }
        .input-wrap .icon svg { width: 20px; height: 20px; }
        .input-wrap input:focus ~ .icon { color: #1dd1a1; }

        .password-strength { display: none; margin: -8px 0 12px; padding: 8px 14px; border-radius: 8px; font-size: 11px; }
        .password-strength.show { display: block; }
        .strength-weak { background: rgba(239,68,68,0.15); color: #ffcccc; border: 1px solid rgba(239,68,68,0.3); }
        .strength-medium { background: rgba(251,191,36,0.15); color: #ffdd99; border: 1px solid rgba(251,191,36,0.3); }
        .strength-strong { background: rgba(29,209,161,0.15); color: #aaffdd; border: 1px solid rgba(29,209,161,0.3); }

        .terms { color: rgba(255,255,255,0.6); font-size: 11px; text-align: center; margin-bottom: 24px; line-height: 1.5; animation: fadeSlide 0.7s ease-out 0.45s both; }
        .terms a { color: white; text-decoration: none; }

        .btn { width: 100%; padding: 16px; border: none; border-radius: 50px; background: white; color: #0d2847; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275); position: relative; overflow: hidden; animation: fadeSlide 0.7s ease-out 0.5s both; font-family: 'Poppins', sans-serif; letter-spacing: 0.5px; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 12px 35px rgba(0,0,0,0.25); }
        .btn:active { transform: translateY(0) scale(0.98); }
        .btn.loading { pointer-events: none; }
        .btn.loading span { opacity: 0; }
        .btn.loading::after { content: ''; position: absolute; width: 20px; height: 20px; border: 3px solid rgba(13,40,71,0.2); border-top-color: #0d2847; border-radius: 50%; animation: spin 0.7s linear infinite; top: 50%; left: 50%; margin: -10px 0 0 -10px; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .error-box { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #ffcccc; padding: 10px 14px; border-radius: 10px; font-size: 12px; margin-bottom: 16px; display: none; animation: fadeSlide 0.3s ease; }
        .error-box.show { display: block; }

        .success-box { background: rgba(29,209,161,0.15); border: 1px solid rgba(29,209,161,0.3); color: #aaffdd; padding: 10px 14px; border-radius: 10px; font-size: 12px; margin-bottom: 16px; display: none; animation: fadeSlide 0.3s ease; }
        .success-box.show { display: block; }

        .switch-text { text-align: center; margin-top: 24px; animation: fadeSlide 0.7s ease-out 0.6s both; }
        .switch-text span { color: rgba(255,255,255,0.6); font-size: 14px; }
        .switch-text a { color: white; text-decoration: none; font-weight: 600; transition: color 0.3s; }
        .switch-text a:hover { color: #1dd1a1; text-decoration: underline; }

        .ripple-effect { position: absolute; border-radius: 50%; background: rgba(29,209,161,0.35); transform: scale(0); animation: ripple 0.5s linear; pointer-events: none; }
        @keyframes ripple { to { transform: scale(4); opacity: 0; } }

        .success { position: fixed; inset: 0; background: linear-gradient(135deg, #070d1f 0%, #16c79a 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; opacity: 0; pointer-events: none; z-index: 1000; transition: opacity 0.4s ease; }
        .success.on { opacity: 1; pointer-events: all; }
        .success-check { width: 90px; height: 90px; border-radius: 50%; background: white; display: flex; align-items: center; justify-content: center; animation: popBounce 0.5s cubic-bezier(0.175,0.885,0.32,1.275) forwards; margin-bottom: 16px; }
        .success-check svg { width: 44px; height: 44px; fill: none; stroke: #1dd1a1; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 50; stroke-dashoffset: 50; animation: drawTick 0.4s ease 0.3s forwards; }
        .success-msg { color: white; font-size: 20px; font-weight: 600; opacity: 0; animation: fadeSlide 0.4s ease 0.5s forwards; }
        @keyframes popBounce { from { transform: scale(0); } to { transform: scale(1); } }
        @keyframes drawTick { to { stroke-dashoffset: 0; } }

        @media (max-width: 768px) {
            body { justify-content: center; }
            .right { width: 90%; max-width: 400px; padding: 30px; }
            .title { font-size: 32px; }
        }
    </style>
</head>
<body>
    <div class="bg-particles" id="particles"></div>

    <div class="right">
        <div class="title">CHATTING</div>
        <div class="subtitle">Crie sua conta e comece a conversar</div>

        <div class="error-box" id="errorBox"></div>
        <div class="success-box" id="successBox"></div>

        <form id="signupForm" autocomplete="off" novalidate>
            <div class="input-wrap">
                <input type="text" id="username" placeholder="Username" required minlength="3" maxlength="30" pattern="[a-zA-Z0-9_.-]+">
                <span class="icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                </span>
            </div>
            <div class="input-wrap">
                <input type="tel" id="telefone" placeholder="Telefone (ex: 841234567)" required pattern="[0-9]{9,15}">
                <span class="icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                </span>
            </div>
            <div class="input-wrap">
                <input type="password" id="password" placeholder="Password (min 8 caracteres)" required minlength="8" maxlength="128">
                <span class="icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                </span>
            </div>
            <div class="password-strength" id="passwordStrength"></div>
            <div class="input-wrap">
                <input type="password" id="password2" placeholder="Confirmar password" required minlength="8" maxlength="128">
                <span class="icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                </span>
            </div>

            <div class="terms">Ao criar conta voce concorda com nossos <a href="#">Termos</a> e <a href="#">Privacidade</a></div>
            <button type="submit" class="btn" id="btn"><span>Criar Conta</span></button>
        </form>

        <div class="switch-text">
            <span>Ja tem conta? </span><a href="/login.html">Entrar</a>
        </div>
    </div>

    <div class="success" id="successOverlay">
        <div class="success-check">
            <svg viewBox="0 0 52 52"><path d="M14.1 27.2l7.1 7.2 16.7-16.8"/></svg>
        </div>
        <div class="success-msg">Conta criada!</div>
    </div>

    <script>
        'use strict';

        const API = window.location.origin + '/api';

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function sanitizeInput(str) {
            return str.replace(/[<>'"&]/g, function(c) {
                return {'<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;','&':'&amp;'}[c];
            });
        }

        function checkPasswordStrength(password) {
            let score = 0;
            if (password.length >= 8) score++;
            if (password.length >= 12) score++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) score++;
            if (/[0-9]/.test(password)) score++;
            if (/[^a-zA-Z0-9]/.test(password)) score++;

            const el = document.getElementById('passwordStrength');
            el.classList.add('show');
            el.classList.remove('strength-weak', 'strength-medium', 'strength-strong');

            if (score <= 2) {
                el.className = 'password-strength show strength-weak';
                return 'weak';
            } else if (score <= 3) {
                el.className = 'password-strength show strength-medium';
                return 'medium';
            } else {
                el.className = 'password-strength show strength-strong';
                return 'strong';
            }
        }

        (function(){
            const c = document.getElementById('particles');
            for(let i=0;i<20;i++){
                const s = document.createElement('span');
                s.style.left = Math.random()*100+'%';
                s.style.animationDuration = (8+Math.random()*12)+'s';
                s.style.animationDelay = Math.random()*10+'s';
                c.appendChild(s);
            }
        })();

        document.getElementById('btn').addEventListener('click',function(e){
            const r = document.createElement('span');
            r.className='ripple-effect';
            const b=this.getBoundingClientRect();
            r.style.left=(e.clientX-b.left)+'px';
            r.style.top=(e.clientY-b.top)+'px';
            this.appendChild(r);
            setTimeout(()=>r.remove(),500);
        });

        document.getElementById('password').addEventListener('input', function(e) {
            if (e.target.value.length > 0) {
                checkPasswordStrength(e.target.value);
            } else {
                document.getElementById('passwordStrength').classList.remove('show');
            }
        });

        function showErr(m){ const el=document.getElementById('errorBox'); el.textContent=m; el.classList.add('show'); document.getElementById('successBox').classList.remove('show'); }
        function hideErr(){ document.getElementById('errorBox').classList.remove('show'); }
        function showSuccess(m){ const el=document.getElementById('successBox'); el.textContent=m; el.classList.add('show'); document.getElementById('errorBox').classList.remove('show'); }

        const COMMON_PASSWORDS = ['password', '12345678', 'qwerty123', 'admin123', 'letmein', 'welcome1', 'monkey123', 'dragon123'];

        document.getElementById('signupForm').addEventListener('submit',async function(e){
            e.preventDefault();
            hideErr();
            const btn=document.getElementById('btn');
            const u=document.getElementById('username').value.trim();
            const tel=document.getElementById('telefone').value.trim();
            const p=document.getElementById('password').value;
            const p2=document.getElementById('password2').value;

            if(!u||!tel||!p||!p2){ showErr('Preencha todos os campos'); return; }

            if(u.length < 3 || u.length > 30) {
                showErr('Username deve ter entre 3 e 30 caracteres');
                return;
            }

            if(!/^[a-zA-Z0-9_.-]+$/.test(u)) {
                showErr('Username so pode conter letras, numeros, _, . e -');
                return;
            }

            const telClean = tel.replace(/\D/g, '');
            if(telClean.length < 9 || telClean.length > 15) {
                showErr('Telefone deve ter entre 9 e 15 digitos');
                return;
            }

            if(p.length < 8) {
                showErr('Password deve ter pelo menos 8 caracteres');
                return;
            }

            if(p.length > 128) {
                showErr('Password muito longa (maximo 128 caracteres)');
                return;
            }

            if(COMMON_PASSWORDS.includes(p.toLowerCase())) {
                showErr('Password muito comum. Escolha outra');
                return;
            }

            if(!/[a-z]/.test(p)) {
                showErr('Password deve conter pelo menos uma letra minuscula');
                return;
            }

            if(!/[A-Z]/.test(p)) {
                showErr('Password deve conter pelo menos uma letra maiuscula');
                return;
            }

            if(!/[0-9]/.test(p)) {
                showErr('Password deve conter pelo menos um numero');
                return;
            }

            if(p !== p2) {
                showErr('Passwords nao coincidem');
                return;
            }

            if(u.toLowerCase() === p.toLowerCase()) {
                showErr('Username e password nao podem ser iguais');
                return;
            }

            btn.classList.add('loading');
            try{
                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 15000);

                const r=await fetch(API+'/registro/',{
                    method:'POST',
                    headers:{'Content-Type':'application/json','Accept':'application/json'},
                    body:JSON.stringify({username:u, password:p, telefone:telClean}),
                    signal: controller.signal
                });
                clearTimeout(timeoutId);

                const d=await r.json();
                if(!r.ok) throw new Error(d.erro||d.detail||'Erro ao criar conta');

                localStorage.setItem('token',d.token);
                localStorage.setItem('user',JSON.stringify(d.usuario));

                btn.classList.remove('loading');
                document.getElementById('successOverlay').classList.add('on');
                setTimeout(()=>{ window.location.href='/'; },1400);
            }catch(err){
                btn.classList.remove('loading');
                if(err.name === 'AbortError') {
                    showErr('Timeout - Servidor sem resposta');
                } else {
                    showErr(err.message||'Backend offline.');
                }
            }
        });

        const sh=document.createElement('style');
        sh.textContent='@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}';
        document.head.appendChild(sh);

        document.addEventListener('mousemove',e=>{
            const mx=(e.clientX-innerWidth/2)*0.006;
            const my=(e.clientY-innerHeight/2)*0.006;
            document.querySelectorAll('.emoji').forEach((el,i)=>{
                const s=(i+1)*0.3;
                el.style.transform='translate('+mx*s+'px, '+my*s+'px)';
            });
        });
    </script>
</body>
</html>
